<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Macro</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root {
  --bg: #f4f6f4; --surface: #ffffff; --surface2: #eef1ee; --line: #dde3de;
  --text: #17201b; --muted: #66736b; --accent: #1f9d5c; --accent-ink: #fff;
  --prot: #3b7ddd; --carb: #e0a422; --fat: #d9547a; --fib: #7a8f3a;
  --warn: #c4511f; --shadow: 0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #18201c; --surface2: #212b26; --line: #2c3832;
    --text: #e8efe9; --muted: #95a39a; --accent: #34c27a; --accent-ink: #06140c;
    --prot: #6aa2f2; --carb: #f0bd4a; --fat: #f07c9c; --fib: #a8c060; --warn: #f08a5d;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #18201c; --surface2: #212b26; --line: #2c3832;
  --text: #e8efe9; --muted: #95a39a; --accent: #34c27a; --accent-ink: #06140c;
  --prot: #6aa2f2; --carb: #f0bd4a; --fat: #f07c9c; --fib: #a8c060; --warn: #f08a5d;
  --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
main { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
h1 { font-size: 22px; margin: 6px 0 12px; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 14px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.row { display: flex; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.iconbtn { border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 16px; }
label.f { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
label.f > input, label.f > select, label.f > textarea { display: block; width: 100%; margin-top: 4px; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.seg { display: flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 7px; padding: 7px 4px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
/* Barre d'onglets */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
nav.tabs button { flex: 1; border: 0; background: none; padding: 8px 0 9px; color: var(--muted); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button.on { color: var(--accent); font-weight: 600; }
/* Résumé du jour */
.big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; }
.macro { margin-top: 10px; }
.macro .row { font-size: 13px; margin-bottom: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.over { color: var(--warn); }
/* Listes */
.item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.item:first-child { border-top: 0; }
.item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font-size: 12px; color: var(--muted); }
.kcal { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mealhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.banner { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.warnbox { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: 10px; padding: 9px 11px; font-size: 13px; margin-top: 8px; }
.stat { background: var(--surface2); border-radius: 10px; padding: 9px 10px; }
.stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.check:first-of-type { border-top: 0; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.check.done .grow { text-decoration: line-through; color: var(--muted); }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
/* Feuille modale */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sheet-b { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; }
#reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 220px; }
#reader video { width: 100%; display: block; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: 90vw; }
.spark { width: 100%; height: 90px; display: block; }
/* Tableau des macros (g / % / kcal) */
.mtable { display: grid; gap: 6px; }
.mrow { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1fr; gap: 6px; align-items: center; }
.mrow > span:first-child { display: flex; flex-direction: column; min-width: 0; font-size: 14px; }
.mhead { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.mhead span { text-align: center; }
.mrow input { width: 100%; text-align: center; padding: 9px 4px; font-variant-numeric: tabular-nums; }
.mval { text-align: center; background: var(--surface2); border-radius: 10px; padding: 9px 4px; font-weight: 600; font-variant-numeric: tabular-nums; }
.okbox { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 10px; padding: 9px 11px; font-size: 13px; margin-top: 8px; }
.macro .sub { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
/* Extras */
.tip { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.tip:first-of-type { border-top: 0; }
.tip > span:first-child { font-size: 18px; width: 24px; text-align: center; flex: none; }
.tip .iconbtn { padding: 0 4px; font-size: 13px; }
.badge { display: block; font-size: 12.5px; background: var(--surface2); border-radius: 8px; padding: 6px 9px; margin: 4px 0 2px; }
details.badge > summary { cursor: pointer; }
.pricebtn { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 2px 0; cursor: pointer; }
.stackbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface2); }
.stackbar i { display: block; height: 100%; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pthumb { position: relative; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; background: var(--surface2); aspect-ratio: 3 / 4; cursor: pointer; }
.pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pthumb span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.65)); padding: 10px 4px 3px; }
.pthumb.sel { border-color: var(--accent); }
nav.tabs button { font-size: 10.5px; }
/* Aide, bouton flottant */
.help { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 700; cursor: pointer; flex: none; }
.fab { position: fixed; right: max(16px, calc(50vw - 304px)); bottom: calc(84px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%;
  border: 0; background: var(--accent); color: var(--accent-ink); font-size: 30px; line-height: 1; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; z-index: 9; }
.datenav { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
.datenav .iconbtn { font-size: 24px; padding: 4px 14px; }
details.card > summary { list-style: none; }
/* Guide de démarrage */
.wiz { position: fixed; inset: 0; background: var(--bg); z-index: 40; display: flex; justify-content: center; }
.wiz-in { width: 100%; max-width: 520px; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.wiz-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; gap: 8px; }
.wiz-dots { display: flex; gap: 6px; }
.wiz-dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); transition: width .2s; }
.wiz-dots i.done { background: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.wiz-dots i.on { width: 22px; background: var(--accent); }
.wiz-body { flex: 1; overflow-y: auto; padding: 4px 20px 16px; }
.wiz-foot { padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.wiz-h { font-size: 26px; margin: 8px 0 4px; }
.wiz-sub { margin: 0 0 16px; }
.wiz-feat { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
.wiz-feat > span:first-child { font-size: 22px; width: 30px; text-align: center; flex: none; }
.opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.opt-ic { font-size: 26px; width: 34px; text-align: center; flex: none; }
/* ============ Allègement : plus d’air, moins de traits ============ */
:root { --shadow: 0 1px 2px rgba(16,24,20,.04), 0 6px 24px rgba(16,24,20,.06); --line: #e4e9e5; --bg: #f3f5f3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --line: #26302b; --shadow: none; --bg: #0d1210; } }
:root[data-theme="dark"] { --line: #26302b; --shadow: none; --bg: #0d1210; }
body { font-size: 16px; line-height: 1.5; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
main { padding: 18px 18px 40px; }
h1 { font-size: 28px; font-weight: 750; letter-spacing: -.02em; }
h2 { font-size: 17px; font-weight: 650; margin-bottom: 10px; }
.small { font-size: 13.5px; }
.card { border: 0; border-radius: 22px; padding: 18px; margin-bottom: 14px; }
.card h2:last-child { margin-bottom: 0; }
.btn { border: 0; border-radius: 14px; padding: 12px 18px; min-height: 46px; font-weight: 550; }
.btn.sm { min-height: 36px; padding: 7px 14px; font-size: 14px; border-radius: 12px; }
.btn.ghost { background: transparent; }
.iconbtn { min-width: 40px; min-height: 40px; font-size: 18px; border-radius: 12px; }
label.f { font-size: 14px; margin-bottom: 14px; }
label.f > input, label.f > select { margin-top: 6px; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { border: 1.5px solid transparent; border-radius: 14px; padding: 12px 14px; }
input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--accent); }
.seg { border: 0; border-radius: 16px; padding: 4px; gap: 4px; }
.seg button { padding: 10px 4px; font-size: 14px; border-radius: 12px; }
.chip { border: 0; padding: 8px 14px; font-size: 14px; }
.stat { border-radius: 16px; padding: 14px; }
.stat .v { font-size: 20px; }
.banner { border: 0; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
.warnbox, .okbox { border: 0; border-radius: 14px; padding: 12px 14px; }
.item { padding: 13px 0; border-top: 1px solid var(--line); gap: 12px; }
.item .name { font-weight: 500; }
.item .meta { font-size: 13px; margin-top: 1px; }
.check { padding: 12px 0; border-top-color: var(--line); }
nav.tabs { border-top: 0; box-shadow: 0 -1px 0 var(--line); padding-top: 4px; }
nav.tabs button { padding: 6px 0 8px; gap: 3px; }
.sheet { border-radius: 24px 24px 0 0; }
.sheet-h { border-bottom: 0; padding: 16px 18px 6px; background: var(--bg); }
.sheet-b { padding: 8px 18px calc(22px + env(safe-area-inset-bottom)); }
.mtable { gap: 8px; }
.mrow input, .mval { border-radius: 12px; }
a { color: var(--accent); text-decoration: none; }
.fab { display: none; }

/* En-tête du journal */
.jhead { display: flex; align-items: center; gap: 4px; margin: 2px 0 16px; }
.jtitle { font-size: 22px; font-weight: 750; letter-spacing: -.01em; text-transform: capitalize; line-height: 1.2; }
.navbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; box-shadow: var(--shadow); flex: none; }
.jhead .help { margin-left: 4px; }
.help { width: 36px; height: 36px; border: 0; background: var(--surface); box-shadow: var(--shadow); }

/* Résumé : anneau + 3 macros */
.summary { cursor: pointer; padding: 20px; }
.sumrow { display: flex; align-items: center; gap: 20px; }
.ringwrap { position: relative; width: 128px; height: 128px; flex: none; }
.ring { width: 128px; height: 128px; display: block; }
.ringtxt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ringnum { font-size: 30px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mini { margin: 6px 0 12px; font-size: 14px; }
.mini:last-child { margin-bottom: 4px; }
.mini .row { margin-bottom: 5px; }
.bar.thin { height: 6px; }
.summary .details { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
@media (max-width: 350px) { .sumrow { gap: 14px; } .ringwrap, .ring { width: 108px; height: 108px; } .ringnum { font-size: 25px; } }

/* Conseils discrets */
.tips { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border-radius: 18px; padding: 6px 12px 6px 14px; margin-bottom: 14px; }
.tips .tip { border-top: 0; padding: 8px 0; }
.tips details summary { padding: 2px 0 8px 34px; }
.hint { text-align: center; color: var(--muted); font-size: 14px; margin: 2px 8px 16px; }

/* Repas */
.meal { padding: 16px 18px 8px; }
.meal .mealhead { align-items: flex-start; margin-bottom: 4px; min-height: 40px; }
.meal .mealhead h2 { margin: 0; }
.meal .item:first-of-type { border-top: 0; }
.meal > .item:first-of-type, .meal .mealhead + .item { border-top: 0; }
.meal:not(:has(.item)):not(:has(.planrow)) { padding-bottom: 14px; }
.addbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); font-size: 24px; line-height: 1; cursor: pointer; flex: none; }
.planrow { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); background: transparent; border-radius: 14px; padding: 11px 14px; margin: 6px 0 10px; color: var(--text); cursor: pointer; font-size: 14px; }
.planrow b { color: var(--accent); }
.menuopt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 16px; padding: 15px 16px; margin-bottom: 8px; cursor: pointer; font-size: 15px; }
.menuopt span { width: 22px; text-align: center; color: var(--accent); font-size: 18px; }

/* Menus : un jour à la fois */
.daystrip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
.daystrip::-webkit-scrollbar { display: none; }
.daystrip button { flex: none; width: 54px; border: 0; background: var(--surface); border-radius: 16px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; box-shadow: var(--shadow); }
.daystrip button span { font-size: 12px; color: var(--muted); text-transform: capitalize; }
.daystrip button b { font-size: 18px; }
.daystrip button i { position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.daystrip button.on { background: var(--accent); color: var(--accent-ink); }
.daystrip button.on span { color: inherit; opacity: .8; }
.daystrip button.on i { background: var(--accent-ink); }
.empty { text-align: center; padding: 32px 22px; }
.empty p { margin: 6px 0 18px; }
.badge { border-radius: 12px; padding: 9px 12px; margin: 4px 0 6px; }

/* Besoins : sous-onglets */
.subtabs { margin-bottom: 16px; }
.subtabs button { font-size: 13.5px; }
/* ============ Typographie plus grande ============ */
body { font-size: 17px; line-height: 1.5; }
.small { font-size: 15px; }
h1 { font-size: 30px; }
h2 { font-size: 19px; }
h3 { font-size: 16.5px; }
.jtitle { font-size: 25px; }
.item .meta, .meta { font-size: 14.5px; }
.kcal { font-size: 17px; }
label.f { font-size: 15px; }
.btn { font-size: 16.5px; }
.btn.sm { font-size: 15px; min-height: 40px; }
.chip { font-size: 15px; }
.seg button { font-size: 15px; }
.subtabs button { font-size: 14.5px; }
.stat .v { font-size: 22px; }
.stat .l { font-size: 13.5px; }
.mini { font-size: 15.5px; }
.ringnum { font-size: 32px; }
.macro .row { font-size: 15px; }
.macro .sub { font-size: 13px; }
.mhead { font-size: 12px; }
.mrow > span:first-child { font-size: 15.5px; }
nav.tabs button { font-size: 12px; }
nav.tabs button svg { width: 24px; height: 24px; }
.daystrip button span { font-size: 13px; }
.daystrip button b { font-size: 19px; }
.toast { font-size: 15.5px; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { font-size: 16.5px; }
.badge { font-size: 14.5px; }
.hint { font-size: 15px; }

.mini .row span:last-child { white-space: nowrap; }
.mini .row { gap: 6px; }
.sumrow { gap: 16px; }
.ringwrap, .ring { width: 116px; height: 116px; }
@media (max-width: 370px) { .mini .row > span:first-child { font-size: 14.5px; } .ringwrap, .ring { width: 104px; height: 104px; } .ringnum { font-size: 27px; } }
.macro .sub { font-size: 13.5px; }
/* Conseils cliquables */
.tip { cursor: pointer; align-items: center; }
.tip > span:first-child { font-size: 22px; width: 28px; }
.tiptitle { font-size: 16px; font-weight: 600; line-height: 1.35; }
.tipcta { font-size: 14.5px; color: var(--accent); font-weight: 600; margin-top: 2px; }

/* ============ Thème sombre bleu nuit + police douce ============ */
body, body.mode-train {
  --bg: #0b0e14; --surface: #151a23; --surface2: #1f2531; --line: #262d3a;
  --text: #f1f4f9; --muted: #8b94a7; --accent: #3a8dff; --accent-ink: #ffffff;
  --prot: #8b93ff; --carb: #f5b942; --fat: #f0708f; --fib: #6fd39a; --warn: #ff7a59;
  --shadow: none;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body, button, input, select, textarea { font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { -webkit-font-smoothing: antialiased; letter-spacing: .005em; }
h1, .jtitle, .big, .ringnum, .stat .v, .lcard b, .livename { font-weight: 800; letter-spacing: -.01em; }
h2, .tiptitle, .solname { font-weight: 700; }
.card { background: var(--surface); }
.btn.primary { box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent); }
nav.tabs { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 -1px 0 var(--line); }
.sheet, .sheet-h { background: var(--bg); }
.livehead { background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.tips { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.navbtn, .help { background: var(--surface); }
.chip.on, .daystrip button.on { box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
#restbar { background: #f1f4f9; color: #0b0e14; }
.lcard .lic { background: color-mix(in srgb, var(--accent) 14%, var(--surface2)); }

/* Boîte de dialogue intégrée */
.dlg-bg { position: fixed; inset: 0; z-index: 60; background: rgba(3, 6, 12, .62); display: flex; align-items: center; justify-content: center; padding: 24px; transition: opacity .15s; }
.dlg-bg.out { opacity: 0; }
.dlg { background: var(--surface); border-radius: 24px; padding: 22px 20px 16px; width: 100%; max-width: 360px; box-shadow: 0 24px 70px rgba(0,0,0,.55); }
.dlg-t { font-size: 19px; font-weight: 800; line-height: 1.3; }
.dlg-m { color: var(--muted); margin-top: 6px; font-size: 15.5px; }
.dlg-in { width: 100%; margin-top: 14px; }
.dlg-b { display: flex; gap: 10px; margin-top: 20px; }
.dlg-b .btn { flex: 1; }
.dangerbtn { background: var(--warn) !important; color: #fff !important; }

/* ============ Animations ============ */
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes dlgIn { from { opacity: 0; transform: scale(.9) translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.22); } 100% { transform: scale(1); } }
@keyframes rowFlash { from { background: color-mix(in srgb, var(--accent) 40%, transparent); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes ringDraw { from { stroke-dasharray: 0 400; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px) scale(.96); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(120%); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }

/* changement d’écran : les blocs arrivent en cascade */
#view.enter > * { animation: fadeUp .42s cubic-bezier(.2, .8, .2, 1) both; }
#view.enter > *:nth-child(2) { animation-delay: .035s; }
#view.enter > *:nth-child(3) { animation-delay: .07s; }
#view.enter > *:nth-child(4) { animation-delay: .105s; }
#view.enter > *:nth-child(5) { animation-delay: .14s; }
#view.enter > *:nth-child(6) { animation-delay: .175s; }
#view.enter > *:nth-child(n+7) { animation-delay: .21s; }
#view.enter .bar > i { transform-origin: left; animation: grow .8s .15s cubic-bezier(.2, .8, .2, 1) both; }
#view.enter .ring circle + circle { animation: ringDraw 1s .1s cubic-bezier(.2, .8, .2, 1) both; }
#view.enter .wbars i, #view.enter .spark, #view.enter svg rect { transform-origin: bottom; animation: growY .7s .15s cubic-bezier(.2, .8, .2, 1) both; transform-box: fill-box; }
/* feuilles, dialogues, barres */
.sheet-bg { animation: fadeIn .2s ease both; }
.sheet { animation: sheetUp .34s cubic-bezier(.2, .9, .25, 1) both; }
.sheet-b > * { animation: fadeUp .35s .08s cubic-bezier(.2, .8, .2, 1) both; }
.dlg-bg { animation: fadeIn .16s both; }
.dlg { animation: dlgIn .26s cubic-bezier(.2, .9, .3, 1.25) both; }
.toast { animation: toastIn .28s cubic-bezier(.2, .9, .3, 1.25) both; }
#restbar, #livebar { animation: slideUp .32s cubic-bezier(.2, .9, .3, 1.1) both; }
#livebar { animation: slideUp .32s both, glow 2.4s 1s ease-in-out infinite; }
/* accueil et guide */
#launch .launch-in > * { animation: fadeUp .55s cubic-bezier(.2, .8, .2, 1) both; }
#launch .launch-in > *:nth-child(2) { animation-delay: .08s; }
#launch .launch-in > *:nth-child(3) { animation-delay: .16s; }
#launch .launch-in > *:nth-child(4) { animation-delay: .26s; }
.wiz-body > * { animation: fadeUp .4s cubic-bezier(.2, .8, .2, 1) both; }
.wiz-body > *:nth-child(2) { animation-delay: .05s; } .wiz-body > *:nth-child(3) { animation-delay: .1s; } .wiz-body > *:nth-child(n+4) { animation-delay: .15s; }
/* retour tactile */
.btn, .chip, .addbtn, .navbtn, .help, .lcard, .menuopt, .sdone, .stype, .daystrip button, nav.tabs button, .opt, .planrow, .pthumb, .livecard, .iconbtn {
  transition: transform .14s cubic-bezier(.2, .8, .2, 1), background-color .2s, color .2s, opacity .2s, box-shadow .2s;
}
.btn:active, .chip:active, .addbtn:active, .navbtn:active, .help:active, .lcard:active, .menuopt:active, .sdone:active, .stype:active,
.daystrip button:active, nav.tabs button:active, .opt:active, .planrow:active, .pthumb:active, .livecard:active, .iconbtn:active { transform: scale(.95); }
.item, .tip, .whist, .summary { transition: opacity .15s, transform .15s; }
.item:active, .tip:active, .whist:active, .summary:active { opacity: .72; transform: scale(.99); }
nav.tabs button.on svg { transform: translateY(-1px); }
.srow.pop { animation: rowFlash .6s ease-out; }
.srow.pop .sdone { animation: pop .38s cubic-bezier(.2, .9, .3, 1.3); }
.srow, .sdone, .item.picked { transition: background-color .25s; }
input, select { transition: border-color .2s, background-color .2s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.addset { margin-top: 10px; background: var(--surface2); }
.restgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.restgrid .chip { justify-content: center; padding: 12px 6px; border-radius: 14px; }
.menuopt.sel { outline: 2px solid var(--accent); }
.mrowbar.wide { grid-template-columns: 120px 1fr 34px; }

/* minuteur de repos : grand panneau en verre */
#restbar {
  left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 15; display: block; padding: 14px 16px 16px; border-radius: 30px;
  background: rgba(28, 28, 30, .82); color: #fff; border: 1px solid var(--glass-brd);
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 -10px 40px rgba(0, 0, 0, .6); max-width: 560px;
}
#restbar .rb-track { height: 5px; border-radius: 3px; background: #3a3a3c; overflow: hidden; }
#restbar .rb-track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s linear; }
#restbar .rb-time { text-align: center; font-size: 64px; font-weight: 300; letter-spacing: .02em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 8px 0 12px; }
#restbar .rb-btns { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; }
#restbar .rb-btns button { border: 0; border-radius: 16px; padding: 14px 0; font-size: 17px; font-weight: 600; background: #3a3a3c; color: #fff; cursor: pointer; }
#restbar .rb-btns .rb-skip { background: var(--accent); }
#livebar ~ #restbar, #restbar { bottom: calc(10px + env(safe-area-inset-bottom)); }

/* graphique hebdomadaire */
.wchart { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin-top: 14px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.wchart > div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.wchart i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.wchart span { position: absolute; bottom: -20px; font-size: 11px; color: var(--muted); }
.wchart + .row { margin-top: 30px !important; }
#view.enter .wchart i { transform-origin: bottom; animation: growY .7s .15s cubic-bezier(.2, .8, .2, 1) both; }
.chip { background: var(--surface2); }
.chip.on { background: var(--accent); box-shadow: none; }
/* ============ Nutrition : même style que la partie sport (noir profond, gris iOS, verre),
   seules les couleurs propres à la nutrition changent (vert, couleurs des macros) ============ */
body:not(.mode-train) {
  --accent: #34c27a; --accent-ink: #04140b;
  --prot: #6aa2f2; --carb: #f0bd4a; --fat: #f07c9c; --fib: #a8c060; --warn: #ff9f0a; --danger: #ff453a; --ok: #34c27a;
}
body:not(.mode-train) .tips { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
body:not(.mode-train) nav.tabs button.on { color: var(--accent); }

/* anneau : chiffre proportionné */
.ringwrap, .ring { width: 128px; height: 128px; }
.ringnum { font-size: 25px; line-height: 1; }
.ringtxt .small { font-size: 12.5px; margin-top: 3px; }
@media (max-width: 370px) { .ringwrap, .ring { width: 112px; height: 112px; } .ringnum { font-size: 22px; } }

/* réglages du menu en sections */
.msec { background: var(--surface); border-radius: 18px; padding: 14px 14px 12px; margin-bottom: 12px; }
.msec-h { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.msec-h b { font-size: 16.5px; }
.msec-ic { font-size: 22px; width: 30px; text-align: center; flex: none; line-height: 1.2; }
.msec label.f:last-child { margin-bottom: 0; }
.msec .seg button { font-size: 14px; }

/* roue de sélection */
.wheel-sub { text-align: center; color: var(--muted); margin: -4px 0 10px; }
.wheel { position: relative; height: 240px; overflow: hidden; border-radius: 18px; }
.wheel-band { position: absolute; left: 6px; right: 6px; top: 96px; height: 48px; border-radius: 16px; background: var(--surface2); pointer-events: none; }
.wheel-list { position: relative; height: 240px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.wheel-list::-webkit-scrollbar { display: none; }
.witem { height: 48px; display: flex; align-items: center; justify-content: center; font-size: 22px; scroll-snap-align: center; cursor: pointer; color: var(--muted); font-variant-numeric: tabular-nums; transition: color .15s; }
.witem.on { color: var(--text); font-weight: 700; }

/* RPE */
.rpe { display: grid; grid-template-columns: 1fr 76px; gap: 10px; }
.rpe-main { background: var(--surface2); border-radius: 22px; padding: 18px 16px 16px; text-align: center; }
.rpe-v { font-size: 58px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.rpe-t { font-size: 19px; font-weight: 700; margin-top: 8px; }
.rpe-d { color: var(--muted); font-size: 15.5px; margin-top: 4px; min-height: 2.6em; }
.rpe-slider { margin-top: 14px; }
.rpe-slider input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; border-radius: 17px; background: linear-gradient(90deg, #30d158, #ffd60a 50%, #ff9f0a 75%, #ff453a); outline: none; margin: 0; }
.rpe-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 42px; height: 42px; border-radius: 50%; background: var(--thumb, #ffd60a); border: 4px solid #1c1c1e; box-shadow: 0 2px 10px rgba(0,0,0,.5); cursor: pointer; }
.rpe-slider input[type=range]::-moz-range-thumb { width: 34px; height: 34px; border-radius: 50%; background: var(--thumb, #ffd60a); border: 4px solid #1c1c1e; cursor: pointer; }
.rpe-ticks { display: flex; justify-content: space-between; padding: 6px 12px 0; font-size: 13px; color: var(--muted); }
.rpe-side { display: grid; grid-template-rows: 1fr 1fr 1.2fr; gap: 10px; }
.rpe-side button { border: 0; border-radius: 18px; background: var(--surface2); color: var(--text); font-size: 26px; cursor: pointer; }
.rpe-side .rpe-ok { background: var(--ok); color: #fff; font-size: 28px; font-weight: 800; }

/* horloge, retour, sélection d’exercices */
.clockbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--glass-brd); background: var(--glass); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); flex: none; }
.backbtn { margin-bottom: 10px; background: var(--surface2); }
.pprev { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface2); color: var(--accent); font-size: 12px; cursor: pointer; flex: none; }
.pickfoot { background: linear-gradient(transparent, var(--sheetbg, #1c1c1e) 30%); padding: 18px 0 2px; margin-top: 6px; }
.pickfoot .btn { border-radius: 16px; min-height: 50px; }
.pfcreate { background: var(--surface2); }
.mediarow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: -6px 0 14px; }
.mediarow .pill { font-size: 14px; }
.exmedia { width: 100%; display: block; border-radius: 18px; background: #fff; max-height: 320px; object-fit: contain; }

/* récap de fin de séance */
.sumhero { text-align: center; padding: 6px 0 2px; }
.sumhero h2 { font-size: 24px; margin: 6px 0 2px; }
.sumic { font-size: 56px; line-height: 1.1; }
.sumhero.pr .sumic { animation: trophy 1s cubic-bezier(.2, .9, .3, 1.4) both, shine 2.2s 1s ease-in-out infinite; }
@keyframes trophy { from { transform: scale(.2) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shine { 0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 214, 10, 0)); } 50% { filter: drop-shadow(0 0 14px rgba(255, 214, 10, .7)); } }
.prcard { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, rgba(255, 214, 10, .16), rgba(255, 159, 10, .06)) !important; border: 1px solid rgba(255, 214, 10, .35); border-radius: 18px; padding: 12px 14px; margin-bottom: 10px; animation: fadeUp .5s cubic-bezier(.2, .8, .2, 1) both; }
.prmed { font-size: 28px; }
.prex { font-weight: 700; }
.prval { text-align: right; }
.prval b { display: block; font-size: 18px; color: #ffd60a; }
.prval span { font-size: 12.5px; color: var(--muted); }
.confetti { position: absolute; left: 0; right: 0; top: 0; height: 0; pointer-events: none; overflow: visible; z-index: 2; }
.confetti i { position: absolute; top: -10px; width: 8px; height: 12px; border-radius: 2px; animation: fall 1.6s cubic-bezier(.2, .6, .4, 1) both; }
@keyframes fall { from { transform: translateY(-20px) rotate(0); opacity: 1; } to { transform: translateY(420px) rotate(540deg); opacity: 0; } }
.sheet-b { position: relative; }
.hset { margin-top: 4px; padding: 3px 6px; border-radius: 8px; }
.hset.isPr { background: rgba(255, 214, 10, .12); }
.hset.isPr span:last-child { color: #ffd60a; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

/* Progrès v2 */
.stat.tap { cursor: pointer; transition: transform .15s; } .stat.tap:active { transform: scale(.97); }
.chev { color: var(--accent); font-weight: 700; }
.delta { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.delta.up { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.delta.down { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.wvhero { text-align: center; margin: 0 0 14px; } .wvbig { font-size: 40px; font-weight: 800; line-height: 1.1; }
.mvrow { display: grid; grid-template-columns: 100px 1fr auto; gap: 10px; align-items: center; width: 100%; border: 0; background: transparent; color: var(--text); padding: 9px 2px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; font: inherit; }
.mvrow:last-of-type { border-bottom: 0; }
.mvic { font-size: 19px; text-align: center; } .mvname { font-size: 15px; font-weight: 600; }
.mvrow .bar { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; display: block; } .mvrow .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.mvval { text-align: right; min-width: 70px; } .mvval b { display: block; font-size: 15px; } .mvval small { font-size: 12px; color: var(--muted); white-space: nowrap; }
.zd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; } .zd.ok { background: var(--ok); } .zd.low { background: var(--muted); } .zd.high { background: var(--warn); }
.seg.mini { width: 120px; } .seg.mini button { padding: 6px 4px; font-size: 13.5px; }
.warnhint { display: block; width: calc(100% - 0px); margin: 12px 0 0; padding: 12px; border: 0; border-radius: 14px; background: color-mix(in srgb, var(--warn) 14%, var(--surface2)); color: var(--text); cursor: pointer; font: inherit; font-size: 14.5px; }
.liftrow { align-items: center; gap: 10px; } .liftrow .name { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.25; } .spk { flex: none; }
.liftv { text-align: right; min-width: 74px; } .liftv b { display: block; } .liftv small { font-size: 12.5px; font-weight: 700; } .liftv .up { color: var(--ok); } .liftv .down { color: var(--warn); }
.cal { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; } .cal > div { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.cal i { display: block; aspect-ratio: 1; border-radius: 4px; background: var(--surface2); } .cal i.on { background: var(--accent); } .cal i.fut { opacity: .3; }

/* courbe de progression */
.pgchips { gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; } .pgchips .chip { padding: 6px 12px; font-size: 13.5px; }
.pghead { display: flex; justify-content: space-between; align-items: flex-end; margin: 10px 0 6px; gap: 10px; }
.pgbig { font-size: 30px; font-weight: 800; line-height: 1.05; } .pgbig small { font-size: 15px; color: var(--muted); font-weight: 600; }
.pgchart { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; margin-top: 8px; }
.pgsvg { width: 100%; height: auto; display: block; overflow: visible; }
.pggrid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.pglab { fill: var(--muted); font-size: 12.5px; font-family: inherit; } .pgtick { stroke: var(--line); stroke-width: 1; }
.pgdot { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.pgtrend { stroke: var(--text); stroke-width: 1.6; stroke-dasharray: 2 4; stroke-linecap: round; opacity: .55; }
.lg-trend { display: inline-block; vertical-align: middle; margin-right: 5px; width: 16px; border-top: 2px dotted var(--text); opacity: .6; }
.pgbest { fill: #ffd60a; stroke: var(--surface); stroke-width: 2.5; }
.pgcur { stroke: var(--text); stroke-width: 1; opacity: .5; } .pgcurdot { fill: var(--text); stroke: var(--accent); stroke-width: 3; }
.pgtip { position: absolute; top: -4px; transform: translate(-50%, -100%); background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 12.5px; display: flex; flex-direction: column; align-items: center; white-space: nowrap; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.35); z-index: 3; }
.pgtip[hidden] { display: none; } .pgtip b { font-size: 15px; }
.lg-line, .lg-dot, .lg-best { display: inline-block; vertical-align: middle; margin-right: 5px; }
.lg-line { width: 16px; height: 3px; border-radius: 2px; background: var(--accent); } .lg-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); } .lg-best { width: 9px; height: 9px; border-radius: 50%; background: #ffd60a; }

/* historique v2 */
.monthhead2 { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 4px 8px; }
.monthhead2 b { font-size: 17px; text-transform: capitalize; } .monthhead2 span { font-size: 13px; color: var(--muted); }
.whist2 { cursor: pointer; padding: 14px; }
.wh-top { display: flex; gap: 12px; align-items: flex-start; }
.wh-date { flex: none; width: 46px; height: 50px; border-radius: 14px; background: var(--surface2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.wh-date b { font-size: 20px; } .wh-date span { font-size: 11.5px; color: var(--muted); margin-top: 3px; text-transform: capitalize; }
.wh-name { margin: 2px 0 6px; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wh-tags { display: flex; gap: 5px; flex-wrap: wrap; } .wh-tags span { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-weight: 600; }
.wh-tags span.pr { background: rgba(255, 214, 10, .15); color: #ffd60a; }
.wh-map { flex: none; width: 66px; margin-top: -2px; } .wh-map .mm-lab { display: none; }
.wh-stats, .wd-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 10px; }
.wd-stats { margin: 0 0 4px; } .wh-stats i, .wd-stats i { display: block; font-size: 12px; }
.wh-stats > div, .wd-stats > div { background: var(--surface2); border-radius: 12px; padding: 8px 10px; }
.wh-stats b, .wd-stats b { display: block; font-size: 15.5px; } .wh-stats span, .wd-stats span { font-size: 12px; color: var(--muted); }
.wh-stats i, .wd-stats i { font-style: normal; font-weight: 700; } i.up { color: var(--ok); } i.down { color: var(--warn); }
.wh-ex > div { display: flex; gap: 8px; align-items: baseline; font-size: 14.5px; padding: 3px 0; }
.wh-ex .n { color: var(--muted); width: 26px; flex: none; font-variant-numeric: tabular-nums; } .wh-ex .grow { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wh-ex .b { color: var(--muted); font-size: 13px; white-space: nowrap; } .wh-ex .more { color: var(--muted); font-size: 13px; padding-left: 34px; }
.wd-mus { display: flex; gap: 12px; align-items: center; } .wd-map { width: 110px; flex: none; }
.wd-mrow { display: grid; grid-template-columns: 82px 1fr 30px; gap: 8px; align-items: center; font-size: 13.5px; margin: 4px 0; }
.wd-mrow .bar { height: 7px; border-radius: 4px; background: var(--surface2); overflow: hidden; } .wd-mrow .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; } .wd-mrow b { text-align: right; }
.wd-exn { color: var(--accent); cursor: pointer; font-size: 16.5px; }
.wd-trend { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; } .wd-trend.up { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); } .wd-trend.down { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.wd-note { font-size: 13.5px; color: var(--muted); margin-top: 8px; }
.wd-sets { margin-top: 10px; }
.wd-sh, .wd-set { display: grid; grid-template-columns: 40px 1fr 70px; gap: 8px; align-items: center; }
.wd-sh { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 6px 4px; } .wd-sh span:last-child, .wd-set span:last-child { text-align: right; }
.wd-set { padding: 7px 6px; border-radius: 10px; font-size: 15px; } .wd-set:nth-child(odd) { background: color-mix(in srgb, var(--surface2) 55%, transparent); }
.wd-set.best { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent); } .wd-set.isPr { background: rgba(255, 214, 10, .12); } .wd-set.warm { opacity: .6; }
.wd-st { width: 26px; height: 26px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.wd-st.w { color: #ffd60a; } .wd-st.d { color: #bf5af2; } .wd-st.f { color: var(--danger); }
@media (max-width: 370px) { .wh-map { display: none; } }

/* compléments */
.supplist { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.supp { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; border-radius: 16px; padding: 11px 12px; background: var(--surface2); color: var(--text); font: inherit; cursor: pointer; transition: background .15s, transform .12s; }
.supp:active { transform: scale(.98); }
.supp .sic { font-size: 22px; width: 28px; text-align: center; flex: none; }
.supp .sname { display: block; font-weight: 700; font-size: 16px; } .supp .smeta { display: block; font-size: 13px; color: var(--muted); } .supp .smeta b { color: var(--prot); font-weight: 600; }
.supp .scheck { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: var(--accent-ink); transition: all .2s cubic-bezier(.2,.9,.3,1.4); }
.supp.on { background: color-mix(in srgb, var(--accent) 14%, var(--surface2)); }
.supp.on .scheck { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
.chipsrow.wrap { flex-wrap: wrap; overflow: visible; }

/* ============ Style iOS 27 « Liquid Glass » (les deux parties) ============ */
:root { --spec: rgba(255, 255, 255, .14); --spec2: rgba(255, 255, 255, .04); --spring: cubic-bezier(.2, .9, .25, 1.25); }
body, button, input, select, textarea { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Nunito", "Segoe UI", Roboto, sans-serif; }
body { -webkit-font-smoothing: antialiased; }
/* lumière d’ambiance derrière le verre (fixe, très douce) */
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  /* lueurs placées vers le centre, fondu progressif : rien ne touche les bords de l’écran */
  background: radial-gradient(circle at 28% 14%, color-mix(in srgb, var(--accent) 26%, transparent) 0, color-mix(in srgb, var(--accent) 12%, transparent) 22vmin, color-mix(in srgb, var(--accent) 4%, transparent) 40vmin, transparent 58vmin),
              radial-gradient(circle at 68% 52%, color-mix(in srgb, var(--prot) 14%, transparent) 0, color-mix(in srgb, var(--prot) 6%, transparent) 20vmin, transparent 42vmin),
              radial-gradient(circle at 40% 92%, color-mix(in srgb, var(--accent) 12%, transparent) 0, color-mix(in srgb, var(--accent) 4%, transparent) 22vmin, transparent 40vmin); }
body { background-color: var(--bg); } #view { position: relative; z-index: 1; }

/* gros titres façon iOS */
#view > .row h1, #view h1 { font-size: 34px; font-weight: 800; letter-spacing: -.025em; }

/* cartes : verre teinté + reflet sur le bord (sans flou, pour rester fluide) */
.card, .stat, .msec, .whist2, .supp, .wh-stats > div, .wd-stats > div {
  background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 74%, transparent), color-mix(in srgb, var(--surface) 60%, transparent));
  border: 0; position: relative;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 8px 28px rgba(0, 0, 0, .28);
}
.card { border-radius: 28px; }
.stat { border-radius: 22px; }
.sheet .card, .sheet .stat, .sheet .msec { background: color-mix(in srgb, var(--surface2) 70%, transparent) !important; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
.wh-stats > div, .wd-stats > div, .supp { background: color-mix(in srgb, var(--surface2) 75%, transparent); box-shadow: inset 0 1px 0 var(--spec2); }
.supp.on { background: color-mix(in srgb, var(--accent) 18%, color-mix(in srgb, var(--surface2) 70%, transparent)); }

/* boutons : capsules en verre */
.btn { border-radius: 999px; background: color-mix(in srgb, var(--surface2) 72%, transparent); box-shadow: inset 0 1px 0 var(--spec), inset 0 0 0 1px var(--spec2);
  transition: transform .25s var(--spring), filter .2s, background .2s; }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent) 55%); color: var(--accent-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(0, 0, 0, .12), 0 6px 14px -6px color-mix(in srgb, var(--accent) 60%, transparent);
  position: relative; z-index: 1; }
body.mode-train .btn.primary { color: #fff; }
.btn:active, .chip:active, .iconbtn:active, .addbtn:active, .supp:active, .clockbtn:active { transform: scale(.94); }
.iconbtn, .addbtn, .navbtn, .clockbtn { border-radius: 50%; box-shadow: inset 0 1px 0 var(--spec), inset 0 0 0 1px var(--spec2); transition: transform .25s var(--spring); }
.addbtn { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 85%, #fff), var(--accent)); color: var(--accent-ink); }
body.mode-train .addbtn { color: #fff; }

/* puces et sélecteurs */
.chip { border-radius: 999px; background: color-mix(in srgb, var(--surface2) 72%, transparent); box-shadow: inset 0 1px 0 var(--spec2); transition: transform .25s var(--spring), background .2s; }
.chip.on { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 85%, #fff), var(--accent)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }
.seg { border-radius: 999px; background: color-mix(in srgb, var(--surface2) 70%, transparent); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25); padding: 3px; }
.seg button { border-radius: 999px; transition: background .25s, transform .25s var(--spring); }
.seg button.on { background: color-mix(in srgb, #fff 16%, var(--surface2)); box-shadow: inset 0 1px 0 var(--spec), 0 3px 10px rgba(0, 0, 0, .3); }

/* champs */
input[type=text], input[type=number], input[type=search], input[type=date], select, textarea {
  border-radius: 14px; border: 0 !important; background: color-mix(in srgb, var(--surface2) 78%, transparent); box-shadow: inset 0 0 0 1px var(--spec2); }
input[type=search] { border-radius: 999px; padding-left: 16px; }
input:focus, select:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 70%, transparent); }

/* fenêtres : verre flouté, grand arrondi, poignée */
.sheet { border-radius: 34px 34px 0 0; background: color-mix(in srgb, var(--bg) 94%, transparent) !important;
  backdrop-filter: blur(60px) saturate(180%); -webkit-backdrop-filter: blur(60px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--spec), 0 -10px 40px rgba(0, 0, 0, .45); }
.sheet-h { background: transparent !important; }
.dlg { border-radius: 30px; backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); box-shadow: inset 0 1px 0 var(--spec), 0 20px 60px rgba(0, 0, 0, .5); }
.dlg .btn { flex: 1; }
.toast { border-radius: 999px; backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 1px 0 var(--spec), 0 10px 30px rgba(0, 0, 0, .4); }

/* barre d’onglets flottante en verre liquide (les deux parties) */
nav.tabs { left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); border-radius: 34px; border: 0 !important;
  background: color-mix(in srgb, var(--surface) 55%, transparent) !important;
  backdrop-filter: blur(28px) saturate(200%); -webkit-backdrop-filter: blur(28px) saturate(200%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), inset 0 0 0 1px rgba(255, 255, 255, .07), 0 12px 36px rgba(0, 0, 0, .5) !important; padding: 5px; max-width: 620px; margin: 0 auto; }
nav.tabs button { border-radius: 28px; transition: background .3s, color .2s, transform .3s var(--spring); }
nav.tabs button.on { background: rgba(255, 255, 255, .11); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12); }
nav.tabs button:active { transform: scale(.9); }
#view { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }

/* en-têtes collants en verre */
.livehead { backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); background: color-mix(in srgb, var(--bg) 62%, transparent); }

@media (prefers-reduced-transparency: reduce) {
  .sheet, .dlg, .toast, nav.tabs, .livehead { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--surface) !important; }
  body::before { display: none; }
}

/* sélection qui glisse */
.slide-pill { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; border-radius: 999px;
  transition: transform .46s cubic-bezier(.3, 1.25, .4, 1), width .46s cubic-bezier(.3, 1.25, .4, 1), height .3s ease; will-change: transform; }
.slider > :not(.slide-pill) { position: relative; z-index: 1; }
.pill-tab { border-radius: 28px; background: rgba(255, 255, 255, .12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 2px 10px rgba(0, 0, 0, .25); }
nav.tabs.slider button.on { background: transparent !important; box-shadow: none !important; }
.pill-seg { background: color-mix(in srgb, #fff 16%, var(--surface2)); box-shadow: inset 0 1px 0 var(--spec), 0 3px 10px rgba(0, 0, 0, .3); }
.seg.slider > button.on { background: transparent !important; box-shadow: none !important; }
.pill-chip { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 85%, #fff), var(--accent)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -1px 0 rgba(0, 0, 0, .12); }
.slider > .chip.on { background: transparent !important; box-shadow: none !important; border-color: transparent !important; }
.pill-day { border-radius: 16px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 85%, #fff), var(--accent)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -1px 0 rgba(0, 0, 0, .12); }
.daystrip.slider > button.on { background: transparent !important; box-shadow: none !important; }
.slider > button, .slider > .chip { transition: color .25s; }
@media (prefers-reduced-motion: reduce) { .slide-pill { transition: none; } }

/* rangées qui défilent : pas de halo extérieur (il serait coupé net par le défilement) */
.chipsrow .chip, .daystrip button { box-shadow: none !important; }
.chipsrow .chip.on, .daystrip button.on { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35) !important; }
.chipsrow.slider > .chip.on, .daystrip.slider > button.on { box-shadow: none !important; }
.pickfoot { z-index: 3; }

/* routines depuis l’historique */
.rtibtn { margin: -2px 0 12px; white-space: normal; line-height: 1.25; }
.rti { background: color-mix(in srgb, var(--surface2) 70%, transparent); border-radius: 18px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; box-shadow: inset 0 1px 0 var(--spec2); transition: background .2s; }
.rti.on { background: color-mix(in srgb, var(--accent) 14%, color-mix(in srgb, var(--surface2) 70%, transparent)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
.rti .pcheck { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
.rti.on .pcheck { background: var(--accent); border-color: var(--accent); color: #fff; }
.rti-ex { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.rti-ex > div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 3px 0; }

/* petits menus contextuels */
.ctxpop-bg { position: fixed; inset: 0; z-index: 70; }
.ctxpop { position: fixed; z-index: 71; overflow-y: auto; border-radius: 22px; padding: 6px;
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  backdrop-filter: blur(40px) saturate(190%); -webkit-backdrop-filter: blur(40px) saturate(190%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 1px rgba(255, 255, 255, .07), 0 18px 50px rgba(0, 0, 0, .55);
  animation: popIn .32s cubic-bezier(.2, 1.1, .3, 1) both; }
.ctxpop.out { animation: popOut .15s ease-in both; }
@keyframes popIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes popOut { to { opacity: 0; transform: scale(.85); } }
.ctxpop-t { font-size: 12.5px; color: var(--muted); padding: 8px 12px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctxpop .menuopt { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0; padding: 12px 12px; min-height: 0; border: 0; border-radius: 14px;
  background: transparent !important; box-shadow: none !important; font-size: 16px; text-align: left; color: var(--text); }
.ctxpop .menuopt + .menuopt { border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); border-radius: 0; }
.ctxpop .menuopt:active { background: rgba(255, 255, 255, .10) !important; border-radius: 14px; }
.ctxpop .menuopt > span:first-child { width: 22px; text-align: center; flex: none; font-size: 15px; }
.ctxpop .menuopt.sel { color: var(--accent); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .ctxpop, .ctxpop.out { animation: none; } }
@media (prefers-reduced-transparency: reduce) { .ctxpop { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--surface); } }

/* boutons ronds : contenu parfaitement centré */
.addbtn, .iconbtn, .navbtn, .clockbtn { display: inline-flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }
.addbtn { position: relative; font-size: 0 !important; flex: none; }
.addbtn::before, .addbtn::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 2.6px; border-radius: 2px; background: currentColor; transform: translate(-50%, -50%); }
.addbtn::after { transform: translate(-50%, -50%) rotate(90deg); }

/* flèches ‹ › dessinées : toujours centrées */
.navbtn[data-n], .datenav .iconbtn[data-n], .iconbtn[data-act=wBack] { position: relative; font-size: 0 !important; padding: 0 !important; width: 40px; height: 40px; min-width: 40px; flex: none; }
.navbtn[data-n]::before, .datenav .iconbtn[data-n]::before, .iconbtn[data-act=wBack]::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; border-left: 2.4px solid currentColor; border-bottom: 2.4px solid currentColor; border-radius: 1.5px;
  transform: translate(-30%, -50%) rotate(45deg); }
.navbtn[data-n="1"]::before, .datenav .iconbtn[data-n="1"]::before { transform: translate(-70%, -50%) rotate(-135deg); }

/* variantes du menu */
.varcur { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 16px; background: color-mix(in srgb, var(--accent) 12%, transparent); margin-bottom: 10px; }
.varrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); font: inherit; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.varrow:active { background: rgba(255, 255, 255, .05); }
.varrow .vn { display: block; font-weight: 650; } .varrow .vm { display: block; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.varrow .vgo { color: var(--muted); font-size: 20px; }
.vtag { font-size: 11.5px; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); padding: 2px 7px; border-radius: 999px; margin-left: 4px; white-space: nowrap; }
.varmeal { display: block; width: 100%; text-align: left; border: 0; color: var(--text); font: inherit; cursor: pointer; padding: 14px; margin-bottom: 10px; border-radius: 20px;
  background: color-mix(in srgb, var(--surface2) 70%, transparent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); transition: transform .25s var(--spring); }
.varmeal:active { transform: scale(.98); }
.vmi { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; padding: 3px 0; }
.vtag.eq { color: var(--prot); background: color-mix(in srgb, var(--prot) 15%, transparent); }
.prefread { font-size: 14px; background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 14px; padding: 8px 12px; margin: -4px 0 12px; display: grid; gap: 3px; }
.msec textarea { width: 100%; resize: vertical; font: inherit; padding: 10px 12px; color: var(--text); }

/* quantité d’un aliment du menu */
.qtyedit { background: color-mix(in srgb, var(--surface2) 70%, transparent); border-radius: 20px; padding: 14px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
.qtyrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.qbtn { width: 52px; height: 52px; border-radius: 50%; border: 0; flex: none; background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--text); font-size: 24px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); transition: transform .2s var(--spring); }
.qbtn:active { transform: scale(.9); }
.qval { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 0; }
.qval input { width: 110px; text-align: center; font-size: 30px; font-weight: 800; padding: 6px 4px; background: transparent !important; box-shadow: none !important; }
.qval span { font-size: 17px; color: var(--muted); }

/* coach : conseils, notes de routine */
.tipc { background: color-mix(in srgb, var(--surface2) 70%, transparent); border-radius: 18px; padding: 12px 14px; margin-bottom: 10px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
.tipc-h { display: flex; gap: 10px; align-items: flex-start; } .tipc-h span { font-size: 20px; line-height: 1.2; } .tipc-h b { font-size: 15.5px; line-height: 1.3; }
.tipc-b { font-size: 14.5px; color: var(--text); opacity: .9; margin-top: 6px; line-height: 1.4; }
.tipc-f { font-size: 14.5px; margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: color-mix(in srgb, var(--ok) 13%, transparent); line-height: 1.4; }
.tipc-r { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.rnote { border: 0; border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; margin-right: 4px; white-space: nowrap; }
.rnote.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); } .rnote.mid { color: #ffd60a; background: rgba(255, 214, 10, .14); } .rnote.low { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.routine .mealhead { align-items: flex-start; } .routine .mealhead > .iconbtn, .routine .mealhead .rnote { flex: none; }
.progbtn { margin-left: auto; margin-right: 6px; }
.scorehero { text-align: center; padding: 6px 0 12px; } .scorev { font-size: 54px; font-weight: 800; line-height: 1; } .scorev small { font-size: 20px; color: var(--muted); }
.scorehero.ok .scorev { color: var(--ok); } .scorehero.mid .scorev { color: #ffd60a; } .scorehero.low .scorev { color: var(--warn); }
.goodlist { display: grid; gap: 4px; font-size: 14.5px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--ok) 10%, transparent); }
.progbars { display: grid; gap: 8px; margin-top: 4px; }
.pb { display: grid; grid-template-columns: 92px 1fr 36px; gap: 8px; align-items: center; font-size: 14px; } .pb b { text-align: right; }
.pbt { position: relative; height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
.pbt .zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ok) 22%, transparent); }
.pbt .v { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 4px; background: var(--muted); } .pbt .v.ok { background: var(--ok); } .pbt .v.low { background: var(--muted); } .pbt .v.high { background: var(--warn); }

/* conseils plus lisibles */
.tipc-l { font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
.tipc-l + .tipc-b, .tipc-l + .tipc-f { margin-top: 3px; }
details.tipc-r summary { cursor: pointer; list-style: none; } details.tipc-r summary::-webkit-details-marker { display: none; }
details.tipc-r div { margin-top: 3px; }
.brief { border-radius: 18px; padding: 12px 14px; margin-bottom: 12px; background: color-mix(in srgb, var(--accent) 13%, transparent); display: grid; gap: 8px; font-size: 14.5px; line-height: 1.35; }
.brief > div { display: flex; gap: 10px; } .brief > div span { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; }
/* dossiers et programme conseillé */
details.folder, details.sugr { margin-bottom: 12px; }
details.folder > summary, details.sugr > summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 12px 14px; border-radius: 20px;
  background: color-mix(in srgb, var(--surface) 70%, transparent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); }
details.folder > summary::-webkit-details-marker, details.sugr > summary::-webkit-details-marker { display: none; }
details.folder > summary::after, details.sugr > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .25s; margin: 0 4px 3px 2px; flex: none; }
details[open].folder > summary::after, details[open].sugr > summary::after { transform: rotate(-135deg); margin-bottom: -3px; }
details.folder[open] > summary { margin-bottom: 10px; } .fic { font-size: 20px; }
details.folder > .card { margin-left: 6px; }
.sugbody { padding: 10px 6px 2px; animation: fadeUp .3s ease both; }
.sugex { display: flex; gap: 10px; justify-content: space-between; font-size: 14.5px; padding: 6px 8px; border-radius: 10px; }
.sugex.chg { background: rgba(255, 214, 10, .1); } .sugex.new { background: color-mix(in srgb, var(--ok) 13%, transparent); }
.sugex s { margin-left: 4px; }
.sugwhy { margin: 10px 0; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--surface2) 70%, transparent); font-size: 13.5px; display: grid; gap: 3px; }
.sugchg { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #ffd60a; background: rgba(255, 214, 10, .13); white-space: nowrap; } .sugchg.none { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.sugweek { display: flex; flex-wrap: wrap; gap: 6px; } .sugweek span { font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: var(--surface2); }
.sugweek span.ok { color: var(--ok); } .sugweek span.low { color: var(--muted); } .sugweek span.high { color: var(--warn); }

/* éditeur de routine */
.rte-name { width: 100%; font-size: 24px; font-weight: 800; padding: 12px 14px !important; margin-bottom: 12px; }
.rte-sum { display: grid; grid-template-columns: 1fr 1fr 1.3fr auto; gap: 8px; margin-bottom: 10px; }
.rte-sum > div { background: color-mix(in srgb, var(--surface2) 72%, transparent); border-radius: 14px; padding: 8px 10px; }
.rte-sum b { display: block; font-size: 16px; } .rte-sum span { font-size: 12px; color: var(--muted); }
.rte-score { display: flex; align-items: baseline; justify-content: center; gap: 1px; min-width: 58px; }
.rte-score b { font-size: 20px; display: inline; } .rte-score.ok b { color: var(--ok); } .rte-score.mid b { color: #ffd60a; } .rte-score.low b { color: var(--warn); }
.rte-ok { font-size: 14px; padding: 9px 12px; border-radius: 14px; background: color-mix(in srgb, var(--ok) 12%, transparent); margin-bottom: 12px; }
details.rte-adv { margin-bottom: 12px; } details.rte-adv > summary { cursor: pointer; list-style: none; font-size: 14.5px; font-weight: 650; padding: 10px 12px; border-radius: 14px; background: rgba(255, 214, 10, .11); color: #ffd60a; }
details.rte-adv > summary::-webkit-details-marker { display: none; } details.rte-adv[open] > summary { margin-bottom: 10px; }
.rtex2 { background: color-mix(in srgb, var(--surface2) 62%, transparent); border-radius: 22px; padding: 12px 12px 14px; margin-bottom: 10px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
.rte-top { display: flex; align-items: center; gap: 10px; }
.rte-n { width: 26px; height: 26px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; background: var(--accent); color: #fff; }
.rte-th { width: 34px; flex: none; } .rte-th svg { width: 34px !important; height: auto; }
.rte-x { display: block; font-size: 16px; line-height: 1.25; }
.rte-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; margin-top: 12px; align-items: end; }
.rte-f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.rte-l { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.rte-reps { display: flex; align-items: center; gap: 6px; } .rte-reps i { font-style: normal; color: var(--muted); font-size: 13px; }
.rte-in { width: 54px; text-align: center; font-size: 17px; font-weight: 700; padding: 8px 4px !important; } .rte-in.wide { width: 100%; }
.rtex2 .stepper { background: color-mix(in srgb, var(--surface) 80%, transparent); border-radius: 999px; }
.rtex2 .stepper button { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; }
.rte-rest { white-space: nowrap; padding: 9px 12px; }
.rte-note { display: block; width: 100%; text-align: left; border: 0; margin-top: 10px; padding: 8px 10px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--muted); font: inherit; font-size: 13.5px; cursor: pointer; }
.rte-add { margin: 4px 0 8px; border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); background: transparent !important; color: var(--accent); }
.rte-foot { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 14px 0 4px; margin-top: 8px; background: linear-gradient(transparent, var(--bg) 35%); z-index: 3; }
@media (max-width: 370px) { .rte-sum { grid-template-columns: 1fr 1fr 1fr; } .rte-score { grid-column: span 3; } .rte-grid { grid-template-columns: 1fr 1fr; } .rte-grid .rte-f:last-child { grid-column: span 2; } }
html { background: #000; } /* même fond noir derrière l’appli dans les deux parties */

/* accueil : réglages */
